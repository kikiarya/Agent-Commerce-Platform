server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8082
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce_platform}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.default_schema: delivery
      hibernate.hbm2ddl.create_namespaces: true
    open-in-view: true
  rabbitmq:
    host: ${MQ_HOST:localhost}
    port: ${MQ_PORT:5672}
    username: ${MQ_USER:demo}
    password: ${MQ_PASSWORD}
# Override GRPC_CLIENT_EMAILSERVICE_ADDRESS / DELIVERY_CALLBACK_URL / STORE_BASE_URL in Docker.
grpc:
  client:
    emailservice:
      negotiationType: plaintext
      address: static://localhost:9091
delivery:
  callback-url: http://localhost:8080/api/webhooks/delivery
  step-seconds: ${DELIVERY_STEP_SECONDS:5}
  loss-rate: ${DELIVERY_LOSS_RATE:0}
  http-timeout-ms: 3000
store:
  base-url: http://localhost:8080
