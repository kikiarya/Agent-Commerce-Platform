server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8083
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce_platform}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.default_schema: email
      hibernate.hbm2ddl.create_namespaces: true
    open-in-view: true
  rabbitmq:
    host: ${MQ_HOST:localhost}
    port: ${MQ_PORT:5672}
    username: ${MQ_USER:demo}
    password: ${MQ_PASSWORD}
grpc:
  server:
    address: ${GRPC_SERVER_ADDRESS:127.0.0.1}
    port: 9091
# Override STORE_BASE_URL in Docker.
store:
  base-url: http://localhost:8080
