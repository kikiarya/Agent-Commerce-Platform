server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8081
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce_platform}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.default_schema: bank
      hibernate.hbm2ddl.create_namespaces: true
    open-in-view: true
  rabbitmq:
    host: ${MQ_HOST:localhost}
    port: ${MQ_PORT:5672}
    username: ${MQ_USER:demo}
    password: ${MQ_PASSWORD}
# Override with GRPC_CLIENT_STORESERVICE_ADDRESS in Docker.
grpc:
  client:
    storeservice:
      negotiationType: plaintext
      address: static://localhost:9090
