server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce_platform}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.default_schema: store
      hibernate.hbm2ddl.create_namespaces: true
    open-in-view: true
  rabbitmq:
    host: ${MQ_HOST:localhost}
    port: ${MQ_PORT:5672}
    username: ${MQ_USER:demo}
    password: ${MQ_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1s
      timeout: 1s
grpc:
  server:
    address: ${GRPC_SERVER_ADDRESS:127.0.0.1}
    port: 9090
# Docker Compose overrides these via STORE_* / APP_CORS_* environment variables.
store:
  bank-base: http://localhost:8081
  delivery-base: http://localhost:8082
  email-base: http://localhost:8083
  http-timeout-ms: 3000
  payment-recovery-ms: 10000
  outbox-poll-ms: 2000
app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001
