name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  trade-core:
    name: trade-core (test + bootJar)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trade-core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests and package jars
        run: ./gradlew test bootJar --no-daemon --stacktrace


      - name: Upload Java test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-core-test-reports
          path: |
            trade-core/**/build/reports/tests/test/**
            trade-core/**/build/test-results/test/*.xml
          if-no-files-found: ignore
          retention-days: 7

  trade-core-ui:
    name: trade-core React UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trade-core/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: trade-core/frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  storefront:
    name: storefront (BFF regression tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storefront
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: storefront/package-lock.json

      - run: npm ci

      - name: Load modules (smoke)
        run: node -e "require('./server/services/tradeCoreClient'); require('./server/routes/checkout'); require('./server/routes/products'); console.log('ok')"

      - name: BFF integration regression
        run: npm test
